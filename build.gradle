plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

sourceSets {
	allthelogsApi {
		java {
			srcDir 'src/allthelogsApi/java'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Java has no built-in database. SQLite is a small file-backed engine that fits this dataset.
	include implementation('org.xerial:sqlite-jdbc:3.50.3.0')

	compileOnly sourceSets.allthelogsApi.output

	testImplementation 'org.xerial:sqlite-jdbc:3.50.3.0'
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def props = ["version": project.version]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.named('compileJava', JavaCompile).configure {
	dependsOn 'compileAllthelogsApiJava'
}

tasks.named('test', Test).configure {
	useJUnitPlatform()
}

jar {
	def archivesName = project.base.archivesName.get()
	inputs.property "archivesName", archivesName

	from("LICENSE") {
		rename { "${it}_${archivesName}" }
	}
	exclude 'me/wolfii/allthelogs/**'
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
