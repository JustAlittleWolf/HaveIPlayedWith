plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.maven_group

base {
    archivesName = project.archives_base_name + "+" + project.minecraft_version
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
}

configurations {
    packedDb {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation("org.dizitart:nitrite-mvstore-adapter:${project.nitrite_version}") {
        exclude group: 'org.slf4j'
        exclude group: 'org.projectlombok'
        exclude group: 'commons-codec'
    }
    // Packed into the mod jar (not nested) so the classes compress under 1 MB.
    // Minecraft already provides slf4j and commons-codec. Extra Nitrite language
    // stopwords, MVStore 3.x compat, and H2 R-trees are unused here.
    packedDb("org.dizitart:nitrite-mvstore-adapter:${project.nitrite_version}") {
        exclude group: 'org.slf4j'
        exclude group: 'org.projectlombok'
        exclude group: 'commons-codec'
        exclude group: 'org.jasypt'
    }

    // Optional AllTheLogs API, never packaged. This coordinate is not published yet;
    // it is always resolved from the git submodule through the includeBuild
    // substitution in settings.gradle. Once AllTheLogs publishes to Modrinth Maven,
    // pin a real version here and drop that includeBuild.
    compileOnly("maven.modrinth:allthelogs:${project.all_the_logs_version}") {
        transitive = false
    }

    testImplementation 'com.google.code.gson:gson:2.13.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def props = ["version": project.version]
    inputs.properties props

    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

jar {
    def archivesName = project.base.archivesName.get()
    inputs.property "archivesName", archivesName
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from("LICENSE") {
        rename { "${it}_${archivesName}" }
    }
    from({
        configurations.packedDb.collect { zipTree(it) }
    }) {
        exclude 'META-INF/maven/**'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/NOTICE*'
        exclude 'META-INF/LICENSE*'
        exclude { FileTreeElement element ->
            String path = element.relativePath.pathString.replace('\\', '/')
            if (path.startsWith('org/dizitart/no2/index/fulltext/languages/')) {
                return path != 'org/dizitart/no2/index/fulltext/languages/English.class'
                    && path != 'org/dizitart/no2/index/fulltext/languages/'
            }
            return false
        }
        exclude 'org/dizitart/no2/mvstore/compat/**'
        exclude 'org/h2/mvstore/rtree/**'
    }

    doLast {
        File jar = archiveFile.get().asFile
        long maxBytes = 1024L * 1024L
        if (jar.length() >= maxBytes) {
            throw new GradleException("Mod jar is ${jar.length()} bytes; must stay under 1 MB: ${jar}")
        }
    }
}
