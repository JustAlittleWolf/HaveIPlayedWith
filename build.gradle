plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.maven_group

base {
    archivesName = project.archives_base_name + "+" + project.minecraft_version
}

repositories {
    mavenCentral()
}

configurations {
    packedDb {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation("com.h2database:h2-mvstore:${project.h2_mvstore_version}")
    packedDb("com.h2database:h2-mvstore:${project.h2_mvstore_version}")

    testImplementation 'com.google.code.gson:gson:2.13.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def props = ["version": project.version]
    inputs.properties props

    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

jar {
    def archivesName = project.base.archivesName.get()
    inputs.property "archivesName", archivesName
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from("LICENSE") {
        rename { "${it}_${archivesName}" }
    }
    from({
        configurations.packedDb.collect { zipTree(it) }
    }) {
        exclude 'META-INF/maven/**'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/NOTICE*'
        exclude 'META-INF/LICENSE*'
        exclude 'org/h2/mvstore/rtree/**'
        exclude 'org/h2/mvstore/tx/**'
        exclude 'org/h2/mvstore/db/**'
    }
}
