pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'haveiplayedwith'

// Compile against the AllTheLogs git checkout. This substitutes
// maven.modrinth:allthelogs, so switching to Modrinth Maven later is just
// removing this includeBuild (keep the same dependency coordinate).
if (!file('allthelogs/settings.gradle.kts').exists()) {
	throw new GradleException(
		"The 'allthelogs' submodule is missing, so the optional AllTheLogs import cannot be compiled.\n" +
			"Run: git submodule update --init"
	)
}

includeBuild('allthelogs') {
	dependencySubstitution {
		substitute module('maven.modrinth:allthelogs') using project(':')
	}
}
